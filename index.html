    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <meta name="apple-mobile-web-app-title" content="Green Scan" />

    <!-- Primary Meta Tags -->
    <title>Green Scan — Instant Barcode Price Scanner</title>
    <meta name="title" content="Green Scan — Instant Barcode Price Scanner" />
    <meta
      name="description"
      content="Make shopping more fun and effortless. Scan any product barcode with your phone camera to see live prices instantly — no paper price stickers needed."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Green Scan — Instant Barcode Price Scanner" />

      property="og:description"
      content="Scan any product barcode with your phone camera to see live prices and offers instantly."
    />
    <meta property="og:image" content="/images/icon-512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Green Scan — Instant Barcode Price Scanner" />

      property="twitter:description"
      content="Scan any product barcode with your phone camera to see live prices and offers instantly."
    />
    <meta property="twitter:image" content="/images/icon-512.png" />

    />

    <meta name="theme-color" content="#00D632" />
